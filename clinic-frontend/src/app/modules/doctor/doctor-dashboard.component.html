<div class="doctor-dashboard">
  <nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container-fluid">
      <a class="navbar-brand">
        <i class="fas fa-user-md me-2"></i>
        Doctor Portal
      </a>
      <div class="navbar-nav ms-auto">
        <span class="nav-link">Welcome, Dr. {{ currentUser?.lastName }}</span>
        <a class="nav-link" (click)="logout()">
          <i class="fas fa-sign-out-alt me-2"></i>Logout
        </a>
      </div>
    </div>
  </nav>

  <div class="container-fluid p-4">
    <div class="row">
      <div class="col-12">
        <h2 class="text-white mb-4">Doctor Dashboard</h2>
        <div class="card">
          <div class="card-body">
            <h5>Welcome to your Doctor Portal</h5>
            <p>Manage your patients, appointments, and medical records here.</p>
            <p><strong>Profile:</strong> Doctor</p>
            <p><strong>Specialization:</strong> {{ currentUser?.doctorDetails?.specialization?.join(', ') || 'General Medicine' }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
